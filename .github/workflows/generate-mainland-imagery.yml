      - name: Preserve verification index and bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hainan-mainland-imagery-verification
          path: |
            tools/hainan-imagery-ci/artifacts/artifact-index.json
            tools/hainan-imagery-ci/generated/verification.json
            tools/hainan-imagery-ci/generated/manifest.json
            tools/hainan-imagery-ci/generated/progress.json
            tools/hainan-imagery-ci/ci-diagnostics/generation.log
          if-no-files-found: warn
          retention-days: 14
