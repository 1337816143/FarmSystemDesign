name: Test and deploy FarmSystem
on:
  push:
    branches: [main]
    paths-ignore: ['.delivery/**', '.github/workflows/release-v020.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and model invariants
        run: npm run check && npm test
      - name: Independent spatial validation
        run: |
          if [ -f tests/spatial.py ]; then
            python -m pip install shapely==2.1.2 pyproj==3.7.2 rasterio==1.4.3 Pillow
            python tests/spatial.py
            python tests/spatial_inputs.py
          fi
      - name: Stamp deployed source identity
        run: |
          if [ -f version.json ]; then
            python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('version.json');v=json.loads(p.read_text());v['commit']=os.environ['GITHUB_SHA'];p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n')
          PY
          fi
      - name: Install browser test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Desktop, mobile, scenario, data and offline end-to-end tests
        run: |
          python3 -m http.server 4173 > /tmp/farmsystem-http.log 2>&1 &
          python tests/browser.py --url http://127.0.0.1:4173 --output test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: test-results
          retention-days: 30
      - name: Preserve focused complete-offline evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farm-complete-offline-evidence
          path: |
            test-results/offline-*.json
            test-results/offline-*.png
          retention-days: 14
      - name: Prepare website without transfer files or workflows
        run: node tools/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: farmsystem-deployed-site
          path: _site
          retention-days: 30
      - name: Preserve full source and public-data backup
        run: git archive --format=zip --output=FarmSystemDesign-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: farmsystem-source-backup
          path: FarmSystemDesign-source.zip
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested research platform
        id: deployment
        uses: actions/deploy-pages@v4
