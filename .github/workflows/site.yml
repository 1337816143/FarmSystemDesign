name: Test and deploy FarmSystem
on:
  push:
    branches: [main]
    paths-ignore: ['.delivery/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and model invariants
        run: npm run check && npm test
      - name: Install browser test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Desktop, mobile, scenario, data and offline end-to-end tests
        run: |
          python3 -m http.server 4173 > /tmp/farmsystem-http.log 2>&1 &
          python tests/browser.py --url http://127.0.0.1:4173 --output test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: test-results
          retention-days: 7
      - name: Prepare website without transfer files or workflows
        run: node tools/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: farmsystem-deployed-site
          path: _site
          retention-days: 7
      - name: Preserve full source and public-data backup
        run: git archive --format=zip --output=FarmSystemDesign-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: farmsystem-source-backup
          path: FarmSystemDesign-source.zip
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified research platform
        id: deployment
        uses: actions/deploy-pages@v4
