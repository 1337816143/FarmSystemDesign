name: Acquire geographic context
on:
  push:
    paths: ['.github/workflows/geographic-context.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  geographic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OSM geographic features and NASA browse imagery
        shell: python
        run: |
          import urllib.request,urllib.parse,json,datetime,pathlib,xml.etree.ElementTree as ET
          folder=pathlib.Path('data/public');folder.mkdir(parents=True,exist_ok=True)
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'FarmSystemDesign/0.1 (+https://github.com/1337816143/FarmSystemDesign)'})
            with urllib.request.urlopen(req,timeout=90) as r:return r.read(),r.headers.get('Content-Type','')
          report=[]
          url='https://api.openstreetmap.org/api/0.6/map?bbox=109.145,18.365,109.205,18.397'
          try:
            raw,_=get(url);root=ET.fromstring(raw);nodes={n.attrib['id']:[float(n.attrib['lon']),float(n.attrib['lat'])] for n in root.findall('node')};features=[]
            for w in root.findall('way'):
              tags={t.attrib['k']:t.attrib['v'] for t in w.findall('tag')}
              if not any(k in tags for k in ['highway','waterway','natural','landuse']):continue
              coords=[nodes[n.attrib['ref']] for n in w.findall('nd') if n.attrib['ref'] in nodes]
              if len(coords)<2:continue
              poly=coords[0]==coords[-1] and len(coords)>3 and ('landuse' in tags or 'natural' in tags)
              features.append({'type':'Feature','id':w.attrib['id'],'properties':{'osm_id':w.attrib['id'],'name':tags.get('name',''),'highway':tags.get('highway'),'waterway':tags.get('waterway'),'natural':tags.get('natural'),'landuse':tags.get('landuse'),'provenance':'OpenStreetMap / ODbL 1.0'},'geometry':{'type':'Polygon' if poly else 'LineString','coordinates':[coords] if poly else coords}})
            obj={'type':'FeatureCollection','source':'OpenStreetMap contributors','license':'ODbL-1.0','sourceUrl':url,'retrievedAt':now,'bbox':[109.145,18.365,109.205,18.397],'features':features}
            (folder/'osm-context.geojson').write_text(json.dumps(obj,ensure_ascii=False,separators=(',',':')))
            report.append({'id':'osm-context','ok':True,'features':len(features),'url':url})
          except Exception as e:report.append({'id':'osm-context','ok':False,'error':str(e),'url':url})
          params={'SERVICE':'WMS','VERSION':'1.1.1','REQUEST':'GetMap','LAYERS':'MODIS_Terra_CorrectedReflectance_TrueColor','STYLES':'','FORMAT':'image/jpeg','SRS':'EPSG:4326','BBOX':'109.10,18.33,109.24,18.43','WIDTH':1024,'HEIGHT':768,'TIME':'2025-01-15'}
          url='https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?'+urllib.parse.urlencode(params)
          try:
            raw,kind=get(url)
            if not raw.startswith(b'\xff\xd8'):raise ValueError('NASA response is not a JPEG: '+kind)
            (folder/'modis-2025-01-15.jpg').write_bytes(raw)
            meta={'id':'nasa-gibs','source':'NASA GIBS / MODIS Terra corrected reflectance','status':'public-imagery','sourceUrl':url,'date':'2025-01-15','retrievedAt':now,'bbox':[109.10,18.33,109.24,18.43],'nativeResolutionM':250,'note':'250m browse visualization; not field-scale analytical imagery. May contain clouds; display only, not used by optimizer.'}
            (folder/'imagery.json').write_text(json.dumps(meta,indent=2))
            report.append({'id':'nasa-gibs','ok':True,'bytes':len(raw),'url':url})
          except Exception as e:report.append({'id':'nasa-gibs','ok':False,'error':str(e),'url':url})
          (folder/'geographic-acquisition-report.json').write_text(json.dumps({'retrievedAt':now,'sources':report},ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
      - name: Commit snapshots
        run: |
          git config user.name 'FarmSystemDesign data bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public
          git diff --cached --quiet || git commit -m 'data: store licensed OSM geometry and NASA satellite context with provenance'
          git pull --rebase origin main
          git push origin main
