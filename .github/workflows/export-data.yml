name: Export baseline test fixture
on:
  push:
    paths: ['.github/workflows/export-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: public-baseline-fixtures
          path: data/public
          retention-days: 7
